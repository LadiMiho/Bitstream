<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- TR-NFR-11: responsive and usable on desktop and tablet resolutions. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bitstream Portal</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="min-h-screen bg-surface-muted font-sans text-ink antialiased">

  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:m-2 focus:rounded focus:bg-surface focus:px-3 focus:py-2">
    Skip to content
  </a>

  <header class="border-b border-line bg-surface">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="text-lg font-semibold">Bitstream Portal</span>
        <span class="status-pill bg-brand-50 text-brand-700" data-role="environment-badge">Development</span>
      </div>

      <nav aria-label="Main" class="hidden gap-1 md:flex" data-role="main-nav">
        <!-- Populated by js/app.js. TR-SEC-17: hiding a control is presentation only; every
             call the pages below make is authorised server-side regardless of what is
             rendered here. -->
      </nav>

      <div class="flex items-center gap-3">
        <span class="text-sm text-ink-muted" data-role="user-name"></span>
        <button type="button" class="btn-secondary" data-action="sign-out" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-7xl px-4 py-8">
    <!-- Populated by the router (js/router.js) with the view for the current #/path. -->
    <div id="app-content"></div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
